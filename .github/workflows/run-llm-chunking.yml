name: Run LLM Chunking GPT2

on:  # ✅ This triggers the workflow on push to main
  push:
    branches:
      - main
  pull_request:

jobs:
  run-llm:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      run: python llm_chunks_gp2.py
